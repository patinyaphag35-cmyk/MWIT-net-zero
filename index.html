<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MWIT Net-Zero Bangkok</title>
  <style>
    /* สไตล์คงเดิมจากที่คุณต้องการ แต่เพิ่มตัวจัดการความปลอดภัยการแสดงผล */
    .screen { display: none; }
    .screen.active { display: block; }
    body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
    .panel { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <!-- หน้า 1: ยินดีต้อนรับ -->
  <section id="welcomeScreen" class="screen active">
    <div class="panel">
      <h1>MWIT Net-Zero Bangkok</h1>
      <form id="identityForm">
        <input type="text" id="fullName" placeholder="ชื่อ-นามสกุล" required style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="text" id="studentClass" placeholder="ชั้น" required style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="number" id="studentNo" placeholder="เลขที่" required style="width:100%; padding:10px; margin-bottom:10px;">
        <label><input type="checkbox" id="privacyConsent" required> ยอมรับเงื่อนไข</label>
        <button type="submit" style="width:100%; padding:15px; margin-top:10px; background:green; color:white; border:none; border-radius:10px;">เริ่มทำ Pre-test</button>
      </form>
    </div>
  </section>

  <!-- หน้า 2: แบบทดสอบ -->
  <section id="quizScreen" class="screen">
    <div class="panel">
      <h2>แบบทดสอบ</h2>
      <p>คำถามชุดที่ 1...</p>
      <button onclick="goToResult()" style="padding:15px; background:blue; color:white;">ส่งคำตอบ</button>
    </div>
  </section>

  <!-- หน้า 3: ผลคะแนน -->
  <section id="resultScreen" class="screen">
    <div class="panel">
      <h2>คะแนนของคุณ</h2>
      <div id="scoreDisplay"></div>
      <button onclick="startGame()" style="padding:15px; background:orange; color:white;">เข้าสู่เกม</button>
    </div>
  </section>

  <script>
    // ตัวแปรเก็บข้อมูล
    const user = { name: "", cls: "", no: "" };

    // ฟังก์ชันเปลี่ยนหน้าจอ (ตัวนี้สำคัญมาก)
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // จัดการฟอร์ม
    document.getElementById('identityForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      user.name = document.getElementById('fullName').value;
      user.cls = document.getElementById('studentClass').value;
      user.no = document.getElementById('studentNo').value;
      
      console.log("บันทึกข้อมูล:", user);
      showScreen('quizScreen');
    });

    function goToResult() {
      document.getElementById('scoreDisplay').innerText = "15/15 คะแนน";
      showScreen('resultScreen');
    }

    function startGame() {
      alert("เริ่มเกม (หน้าจอเกม 3D จะโหลดที่นี่)");
    }
  </script>
</body>
</html>
